name: Build Windows desktop

on:
  workflow_dispatch:
  push:
    branches: [build-windows-desktop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "desktop/**"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Test và build backend
        working-directory: backend
        run: .\mvnw.cmd -B test package

      - name: Cài dependency frontend
        working-directory: frontend
        run: npm ci

      - name: Kiểm tra và build frontend
        working-directory: frontend
        run: |
          npm run build
          npx tsc --noEmit
          npx eslint .

      - name: Cài dependency desktop
        working-directory: desktop
        run: npm ci

      - name: Chuẩn bị backend và frontend
        working-directory: desktop
        run: npm run prepare:resources

      - name: Tạo Java runtime gọn
        shell: pwsh
        run: |
          & "$env:JAVA_HOME\bin\jlink.exe" `
            --add-modules ALL-MODULE-PATH `
            --strip-debug `
            --no-man-pages `
            --no-header-files `
            --compress=2 `
            --output desktop/build-resources/jre

      - name: Thêm FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $ffmpeg = Get-ChildItem "C:\ProgramData\chocolatey\lib" `
            -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -gt 1000000 } |
            Select-Object -First 1
          if (-not $ffmpeg) { throw "Khong tim thay ffmpeg.exe" }
          New-Item -ItemType Directory -Force desktop/build-resources/ffmpeg | Out-Null
          Copy-Item $ffmpeg.FullName desktop/build-resources/ffmpeg/ffmpeg.exe

      - name: Kiểm tra tài nguyên đóng gói
        working-directory: desktop
        run: |
          npm run check
          npm run verify:resources

      - name: Đóng gói EXE
        working-directory: desktop
        run: npm run dist:win

      - name: Smoke test bản Portable
        shell: pwsh
        run: |
          $portable = Get-ChildItem desktop/release/RapPhim-WareHouse-Portable-*.exe |
            Select-Object -First 1
          if (-not $portable) { throw "Khong tim thay ban Portable" }

          $userData = Join-Path $env:RUNNER_TEMP "rapphim-portable-user-data"
          $readyFile = Join-Path $env:RUNNER_TEMP "rapphim-portable-ready.txt"
          $errorFile = "$readyFile.error"
          New-Item -ItemType Directory -Force $userData | Out-Null
          $env:RAPPHIM_USER_DATA_DIR = $userData
          $env:RAPPHIM_READY_FILE = $readyFile
          $process = Start-Process -FilePath $portable.FullName -PassThru

          try {
            $ready = $false
            for ($i = 0; $i -lt 120; $i++) {
              if (Test-Path $readyFile) {
                $ready = $true
                break
              }
              if (Test-Path $errorFile) {
                throw "Ban Portable khoi dong loi: $(Get-Content $errorFile)"
              }
              if ($process.HasExited) {
                throw "Ban Portable da thoat som, exit=$($process.ExitCode)"
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "Ban Portable khong san sang sau 120 giay" }
            Write-Host "Portable ready: $(Get-Content $readyFile)"
          }
          finally {
            if (Test-Path "$userData/desktop.log") {
              Get-Content "$userData/desktop.log"
            }
            if (-not $process.HasExited) {
              taskkill /pid $process.Id /T /F | Out-Null
            }
          }

      - name: Tạo SHA256
        shell: pwsh
        run: |
          Get-FileHash desktop/release/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content desktop/release/SHA256SUMS.txt

      - name: Tải artifact lên GitHub
        uses: actions/upload-artifact@v4
        with:
          name: RapPhim-Windows-${{ github.sha }}
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
